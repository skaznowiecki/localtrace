services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    volumes:
      - ./data:/app/data
    ports:
      - "4318:4318"
      - "4317:4317"
    environment:
      - LT_DATABASE_PATH=/app/data/local-tracer.db
      - LT_API_PORT=4318
      - LT_GRPC_PORT=4317
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4318/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4371:4371"
    environment:
      - VITE_API_PROXY_TARGET=http://api:4318
    depends_on:
      api:
        condition: service_healthy
